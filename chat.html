<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>LLchat - 私信/群聊</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="container">
    <h1>私信/群聊</h1>
    <div id="auth">
      <h2>注册</h2>
      <input id="reg_nick" placeholder="昵称">
      <input id="reg_pwd" type="password" placeholder="密码">
      <button id="btn_register">注册</button>

      <h2>登录</h2>
      <input id="login_nick" placeholder="昵称">
      <input id="login_pwd" type="password" placeholder="密码">
      <button id="btn_login">登录</button>

      <p id="auth_msg" class="msg"></p>
    </div>

    <div id="chat_ui" style="display:none">
      <div class="top">
        <span id="me"></span>
        <button id="btn_logout">登出</button>
      </div>

      <div class="create-chat">
        <h3>创建私聊/群聊（2~5人）</h3>
        <input id="participants" placeholder="请输入参与者昵称，以逗号分隔（含自己）">
        <button id="btn_create_chat">创建</button>
        <p id="create_msg" class="msg"></p>
      </div>

      <div class="chat-list">
        <h3>会话</h3>
        <ul id="chats"></ul>
      </div>

      <div class="messages">
        <h3 id="chat_title">消息</h3>
        <div id="messages_box" class="messages-box"></div>
        <div class="send">
          <input id="msg_input" placeholder="输入消息...">
          <button id="btn_send">发送</button>
        </div>
      </div>
    </div>
  </div>

  <script src="js/chat.js"></script>
</body>
</html>
